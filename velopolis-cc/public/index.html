
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Landing Page</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .bg {
            /* The image used */
            background-image: url('image1.jpg');

            /* Full height */
            height: 100%; 

            /* Center and scale the image nicely */
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;

            /* Add the animation */
            animation: slide 30s infinite;
        }

        @keyframes slide {
            0% {background-image: url('assets/IMG_01.png');}
            20% {background-image: url('assets/IMG_02.png');}
            40% {background-image: url('assets/IMG_03.png');}
            60% {background-image: url('assets/IMG_04.png');}
            80% {background-image: url('assets/IMG_05.png');}
            100% {background-image: url('assets/IMG_01.png');}
        }

        .content {
            position: absolute;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5); /* Black background with transparency */
            color: #f1f1f1;
            width: 100%;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="bg"></div>

<div class="content">
    <h1>Welcome to velopolis.cc</h1>
    <p>Coming soon...</p>
</div>
</body>
</html>
